<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小说写作质量门禁 (Novel Quality Gate) - GPT 6.1 两轮架构红队审查实录</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --red: #f43f5e;
            --amber: #f59e0b;
            --blue: #38bdf8;
            --green: #10b981;
            --font-mono: 'JetBrains Mono', Consolas, monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            line-height: 1.7;
            padding: 24px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .meta { color: var(--text-muted); font-size: 14px; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-right: 8px; }
        .tag-red { background: rgba(244, 63, 94, 0.2); color: var(--red); border: 1px solid var(--red); }
        .tag-blue { background: rgba(56, 189, 248, 0.2); color: var(--blue); border: 1px solid var(--blue); }
        .report-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        h2 { font-size: 20px; color: var(--blue); margin-top: 10px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        h3 { font-size: 17px; color: #f8fafc; margin-top: 20px; margin-bottom: 10px; }
        pre { background: #070a12; padding: 16px; border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; color: #bae6fd; border: 1px solid rgba(255,255,255,0.05); }
        blockquote { border-left: 4px solid var(--amber); padding-left: 14px; margin: 14px 0; color: #fde68a; background: rgba(245, 158, 11, 0.08); padding-top: 8px; padding-bottom: 8px; border-radius: 0 6px 6px 0; }
        ul, ol { padding-left: 20px; margin: 12px 0; }
        li { margin-bottom: 6px; }
        code { font-family: var(--font-mono); background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #f472b6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="tag tag-red">Red-Team Review 实录</span>
            <span class="tag tag-blue">Model: gpt-6.1-sol</span>
            <h1>AI 小说质量门禁系统 (Novel Quality Gate) - 真实审查报告实录</h1>
            <div class="meta">审查目标：/home/ubuntu/novel_quality_gate.py | 审查端点：http://127.0.0.1:10100/v1 | 生成时间：2026-10-20</div>
        </header>

        <div class="report-box">
            <h2>⚔️ Round 1：架构设计与规则算法审查（20,578 字节）</h2>
            <div id="content-r1"></div>
        </div>

        <div class="report-box">
            <h2>🛡️ Round 2：生产级工程韧性、并发与容错审查（15,072 字节）</h2>
            <div id="content-r2"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('gate_review_round1.raw.md')
            .then(res => res.text())
            .then(text => document.getElementById('content-r1').innerHTML = marked.parse(text));
        fetch('gate_review_round2.raw.md')
            .then(res => res.text())
            .then(text => document.getElementById('content-r2').innerHTML = marked.parse(text));
    </script>
</body>
</html>
